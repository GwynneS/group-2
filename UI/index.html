<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Buddy Interface</title>
    <link rel="stylesheet" href="colorScheme.css">
</head>
<body>
    <main class="window-container">
        <div class="window-content">
            <div class="left-column">
                <section id="video-box" class="panel-box">
                    <h2>Video Feed</h2>
                    <div class="media-placeholder" aria-label="Video feed placeholder">
                        <span class="media-icon" aria-hidden="true">LIVE</span>
                        <p>Camera feed will appear here</p>
                    </div>
                </section>

                <section id="animation-box" class="panel-box">
                    <h2>Imported Animation</h2>
                    <div class="media-placeholder animation-placeholder" aria-label="Imported animation placeholder">
                        <canvas id="buddy-sprite" width="64" height="64" role="img" aria-label="Detailed pixel cat companion, lounging"></canvas>
                        <p id="animation-caption" role="status">Waiting for Python companion...</p>
                    </div>
                </section>
            </div>

            <section id="interaction-box" class="panel-box">
                <h2>Chat</h2>
                <div id="chat-history" role="log" aria-live="polite" aria-label="Chat log">
                    <article class="message ai-message">
                        <p><strong>Buddy</strong><br>Hello! What can I help you with today?</p>
                    </article>
                </div>

                <form id="chat-form">
                    <label class="sr-only" for="user-input">Message Buddy</label>
                    <input type="text" id="user-input" name="user-input" placeholder="Type a message..." required>
                    <button type="submit">Send</button>
                </form>
            </section>
        </div>
    </main>
    <script src="animation.js" defer></script>
</body>
</html>
