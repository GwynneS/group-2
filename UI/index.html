<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Buddy Interface</title>
</head>
<body>
    <link rel="index" href="colorScheme.css">

    <main>
        <!-- Character and Status Area -->
        <section id="idle-box">
            <figure>
                <!-- Native HTML happiness bar -->
                <figcaption>
                    <label for="happiness-bar">Happiness Level:</label>
                    <meter id="happiness-bar" min="0" max="100" low="30" high="75" optimum="100" value="80">
                        80%
                    </meter>
                </figcaption>
            </figure>
        </section>

        <!-- Interaction Area -->
        <section id="interaction-box">
            <div id="chat-history" role="log" aria-live="polite">
                <!-- Example of a starting message -->
                <article class="message ai-message">
                    <p><strong>Buddy:</strong> Hello! What can I help you with today?</p>
                </article>
            </div>

            <form id="chat-form">
                <label for="user-input">Message:</label>
                <input type="text" id="user-input" name="user-input" placeholder="Say something nice..." required>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

</body>
</html>
